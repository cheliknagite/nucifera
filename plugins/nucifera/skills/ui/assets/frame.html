<!doctype html>
<!-- nucifera mockup frame. Copy to .design/<name>.html together with tokens.css, kit.css, frame.js and probe.js.
     One <figure class="screen"> per screen; write only the .app content, frame.js draws the optional chrome
     (status bar, top bar, bottom action; approximate when it stands for a host platform's own controls).
     Attributes: data-screen (id), data-bar-title, data-bar-subtitle, data-bar-left or data-bar-back, data-bar-more="false",
     data-action (bottom action label), data-statusbar="false". Set lang on .app to the content language. -->
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mockup</title>
<!-- set the theme before the first paint, so verify never measures a dark-to-light transition -->
<script>(function(){var t=new URLSearchParams(location.search).get('theme');if(t)document.documentElement.dataset.theme=t;})();</script>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="kit.css">
<!-- <link rel="stylesheet" href="brand.css"> -->
<style>
  body { margin: 0; background: #141417; font-family: var(--font-sans); }
  [data-theme="light"] body { background: #c9c6da; }
  .screens { display: flex; flex-wrap: wrap; gap: 32px; padding: 32px; align-items: flex-start; }
  .screen { margin: 0; display: flex; flex-direction: column; gap: 10px; }
  .screen > figcaption { font: 13px/1.4 system-ui, sans-serif; color: #8e8e97; padding-left: 4px; }
  .phone { width: var(--pw, 390px); height: var(--ph, 844px); border-radius: 44px; overflow: hidden; display: flex; flex-direction: column;
    background: var(--bg-0); box-shadow: 0 0 0 1px rgb(255 255 255 / .12), 0 30px 70px -30px rgb(0 0 0 / .7); container-type: size; position: relative; }
  .phone > .app { flex: 1; min-height: 0; overflow: hidden; }
  /* optional chrome: system font on purpose, it stands for the OS or host app, not the page */
  .chrome { font-family: -apple-system, "SF Pro Text", system-ui, "Segoe UI", Roboto, sans-serif; color: var(--fg-1); background: var(--bg-0); flex: none; position: relative; z-index: 3; }
  .chrome-status { height: 44px; display: flex; justify-content: space-between; align-items: center; padding: 0 30px 0 34px; font-weight: 600; font-size: 16px; }
  .chrome-status__icons { display: flex; gap: 6px; align-items: center; }
  .chrome-nav { height: 52px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 0 16px; font-size: 17px; }
  .chrome-nav__l { justify-self: start; display: flex; align-items: center; gap: 2px; }
  .chrome-nav__t { display: flex; flex-direction: column; align-items: center; line-height: 1.15; }
  .chrome-nav__t small { font-size: 12px; color: var(--fg-3); }
  .chrome-nav__r { justify-self: end; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; }
  .chrome-nav__r:not(:empty) { background: var(--line-2); }
  .chrome-bar { padding: 8px 16px 0; }
  .chrome-btn { height: 50px; border-radius: 12px; background: var(--cta-bg); color: var(--cta-fg); display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 600; }
  .chrome-home { width: 134px; height: 5px; border-radius: 3px; background: var(--fg-1); margin: 13px auto 8px; opacity: .9; }
  body.ui-shot { background: #000; }
  body.ui-shot .screens { padding: 0; }
  body.ui-shot .screen > figcaption, body.ui-shot .gallery-note { display: none; }
  body.ui-shot .phone { border-radius: 0; box-shadow: none; }
  .gallery-note { padding: 24px 32px 0; color: #8e8e97; font: 13px/1.5 system-ui, sans-serif; }
</style>
</head>
<body>
<p class="gallery-note">Mockup. System chrome is shown approximately.</p>
<div class="screens">

  <figure class="screen" data-screen="example" data-bar-title="App" data-bar-left="Close" data-action="Main action">
    <div class="phone">
      <main class="app" lang="en">
        <div class="pad" style="padding-top: 16px">
          <h1 class="t-display">Screen title</h1>
          <p class="lead">One sentence about what is on this screen.</p>
        </div>
      </main>
    </div>
    <figcaption>Example</figcaption>
  </figure>

</div>
<script src="frame.js"></script>
</body>
</html>
